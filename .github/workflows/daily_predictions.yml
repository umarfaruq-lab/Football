name: Enterprise Football Pipeline

on:
  schedule:
    - cron: '0 7 * * *' # Runs daily at 7:00 AM UTC (7:00 AM Sierra Leone Local Time)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute quantitative pipeline & update SQLite DB
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push database & chart updates
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Safely commit SQLite DB and chart image if they exist
          if [ -f tracker.db ]; then git add tracker.db; fi
          if [ -f performance_chart.png ]; then git add performance_chart.png; fi
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update enterprise SQLite tracker and equity chart [skip ci]" && git push)
